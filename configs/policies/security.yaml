commands:
  allow:
    - git
    - python
    - python.exe
    - py
    - pytest
    - ruff
    - mypy
    - node
    - npm.cmd
  deny_tokens:
    - rm
    - del
    - erase
    - format
    - shutdown
    - reg
    - runas
    - Invoke-Expression
    - Start-Process
  timeout_seconds: 120
  max_log_bytes: 65536
workspace:
  max_files_per_artifact: 12
  max_file_bytes: 200000
environment_allow:
  - PATH
  - Path
  - SystemRoot
  - TEMP
  - TMP
  - PYTHONPATH
# Declared capability policy (P2.1, ADR 0028) — read by
# execution/capabilities.py to build the manifest handed to the planner
# and worker as data. Empty on purpose: Agentarium's own backend deps
# (fastapi, pydantic, sqlalchemy, ...) happen to be importable in the same
# venv, but that's an accident of implementation, never a guarantee for
# delivered code. ADR 0020: enumerating them would couple generated
# content to internal dependencies that can change.
packages:
  allowed: []
network: deny
