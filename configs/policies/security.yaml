commands:
  allow:
    - git
    - python
    - python.exe
    - py
    - pytest
    - ruff
    - mypy
    - node
    - npm.cmd
  deny_tokens:
    - rm
    - del
    - erase
    - format
    - shutdown
    - reg
    - runas
    - Invoke-Expression
    - Start-Process
  timeout_seconds: 120
  max_log_bytes: 65536
workspace:
  max_files_per_artifact: 12
  max_file_bytes: 200000
environment_allow:
  - PATH
  - Path
  - SystemRoot
  - TEMP
  - TMP
  - PYTHONPATH
